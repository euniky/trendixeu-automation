name: Refresh bio page

on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 ora Romaniei (UTC+3), in fiecare zi
  workflow_dispatch:        # buton "Run workflow" manual
    inputs:
      clips:
        description: "Cate clipuri noi sa genereze"
        default: "6"
      zernio_check:
        description: "Doar verifica conexiunea Zernio (true/false)"
        default: "false"
      premium_demo:
        description: "Numarul clipului de refacut cu voce gratuita vs premium (gol = nimic)"
        default: ""

concurrency:
  group: publicare
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://trendixeu.netlify.app/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaleaza dependinte
        run: pip install -r requirements.txt

      - name: Instaleaza ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5

      - name: Memoria traducerilor
        uses: actions/cache@v4
        with:
          path: data/.cache
          key: translations-${{ github.run_id }}
          restore-keys: translations-

      - name: Genereaza pagina de bio
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          CLIPS_PER_DAY: ${{ github.event.inputs.clips || '6' }}
          CLIP_VOICE: "none"   # fara voce; muzica se adauga din TikTok
          GH_TOKEN: ${{ github.token }}
          DEMO_PREMIUM: ${{ github.event.inputs.premium_demo || '' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/sync_bio.py

      - name: Pregateste site-ul
        run: touch public/.nojekyll

      - name: Configureaza GitHub Pages
        uses: actions/configure-pages@v5

      - name: Incarca site-ul
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publica pe GitHub Pages
        uses: actions/deploy-pages@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Actualizeaza poarta Netlify (doar cand se schimba)
        # Fiecare publicare pe Netlify costa 15 credite din cele 300 gratuite pe luna,
        # asa ca Netlify se publica doar cand se schimba poarta sau contorul de click-uri.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          h=$(cat site/netlify-front/_redirects netlify/functions/*.mjs package.json | sha256sum | cut -c1-16)
          old=$(cat data/.cache/netlify_hash 2>/dev/null || echo none)
          if [ "$h" != "$old" ]; then
            npm install --no-audit --no-fund
            npx --yes netlify-cli@latest deploy --prod --dir=site/netlify-front --functions=netlify/functions --message "Poarta Netlify $h"
            mkdir -p data/.cache && echo "$h" > data/.cache/netlify_hash
          else
            echo "Netlify neschimbat: nicio publicare, niciun credit consumat"
          fi

      - name: Programeaza clipurile pe TikTok (Zernio)
        continue-on-error: true
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          CLIP_BASE: https://euniky.github.io/trendixeu-automation   # direct de pe GitHub, fara credite Netlify
        run: python scripts/post_tiktok.py ${{ github.event.inputs.zernio_check == 'true' && '--check' || '' }}

      - name: Copie de rezerva a clipurilor (7 zile)
        if: hashFiles('public/clips/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: clipuri-${{ github.run_number }}
          path: public/clips/*.mp4
          retention-days: 7

      - name: Previzualizari ale clipurilor (pentru verificare)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/prev
          cp public/clips/sheet-*.jpg /tmp/prev/ 2>/dev/null || true
          cp public/status.json /tmp/prev/ 2>/dev/null || true
          cp public/zernio.json /tmp/prev/ 2>/dev/null || true
          cd /tmp/prev && git init -q -b previews && git add . \
            && git -c user.name=trendixeu-bot -c user.email=trendixeu-bot@users.noreply.github.com commit -qm "Previzualizari rularea ${{ github.run_number }}" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews || echo "Previzualizarile nu au putut fi salvate"

      - name: Salveaza jurnalul clipurilor si pastreaza programarea activa
        # GitHub opreste singur programarile zilnice dupa 60 de zile fara activitate in repo.
        run: |
          git config user.name "trendixeu-bot"
          git config user.email "trendixeu-bot@users.noreply.github.com"
          if ! git diff --quiet -- data/video_log.json 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard data/video_log.json)" ]; then
            git add data/video_log.json
            git commit -m "Clipuri noi: rularea ${{ github.run_number }}"
          else
            days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
            echo "Zile de la ultima activitate: $days"
            if [ "$days" -ge 45 ]; then git commit --allow-empty -m "keepalive: mentine programarea zilnica activa"; fi
          fi
          git pull --rebase -q origin main && git push -q origin HEAD:main || echo "Nimic de trimis"
